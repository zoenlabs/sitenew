server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---- Compressão ----
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json application/xml;

    # ---- Headers de segurança ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ---- Assets versionados: cache longo ----
    location ~* \.(?:css|js|png|jpe?g|gif|ico|svg|webp|woff2?|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # ---- HTML sempre revalidado ----
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---- SPA-friendly fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # arquivos de infraestrutura servidos direto
    location = /robots.txt      { access_log off; }
    location = /sitemap.xml     { access_log off; }
    location = /site.webmanifest { access_log off; }
}
